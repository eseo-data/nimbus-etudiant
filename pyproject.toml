[project]
name = "nimbus"
version = "0.1.0"
description = "Fil rouge du module Programmation fonctionnelle — ESEO, 5e année IA & Data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "mypy>=1.10",
]
# Parcours Big Data uniquement : uv sync --group bigdata
# PySpark demande un Java 17 ou 21 installé sur la machine.
bigdata = [
    "jax>=0.4.30",     # version CPU : tourne sur n'importe quel laptop
    "polars>=1.0",
    "pyspark>=4.0",
]

[project.scripts]
nimbus = "nimbus.app:main"
nimbus-bd = "nimbus.app:main_bd"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nimbus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/nimbus"]

[[tool.mypy.overrides]]
module = ["jax.*", "pyspark.*", "polars.*"]
ignore_missing_imports = true
